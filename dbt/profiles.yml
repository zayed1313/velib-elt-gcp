velib:
  target: prod
  outputs:
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DBT_DATASET', 'velib') }}"
      location: "{{ env_var('BQ_LOCATION', 'EU') }}"
      threads: 4
      job_execution_timeout_seconds: 300